name: Actualizar Ofertas Automáticamente

on:
  schedule:
    - cron: '*/15 * * * *'  # Se ejecuta cada 15 minutos
  workflow_dispatch:        # Permite ejecutarlo manualmente con un clic

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar Repositorio
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: setup-python@v4
        with:
          python-version: '3.x'

      - name: Descargar y Validar Ofertas
        run: |
          python3 -c "
          import urllib.request
          import json
          import sys

          url = 'https://script.google.com/macros/s/AKfycbxFYMAJGl3N-mKty4hxblBHYioBvNZpP_ijSxIFd0aDeNcSJVcOBhn-4BORxSHLt4jVEg/exec'

          try:
              req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
              with urllib.request.urlopen(req, timeout=30) as resp:
                  raw_data = resp.read().decode('utf-8')

              data = json.loads(raw_data)
              if isinstance(data, list) and len(data) > 0:
                  with open('ofertas.json', 'w', encoding='utf-8') as f:
                      json.dump(data, f, ensure_ascii=False, indent=2)
                  print(f'✅ Guardadas {len(data)} ofertas exitosamente.')
              else:
                  print('⚠️ La respuesta no contiene una lista de ofertas válida.')
          except Exception as e:
              print(f'Error al obtener ofertas: {e}')
              sys.exit(1)
          "

      - name: Guardar Cambios en Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add ofertas.json
          git diff --staged --quiet || (git commit -m "Auto-actualización de ofertas [skip ci]" && git push)
